# ===============================
# Application
# ===============================
spring.application.name=panhoramix-backend-test

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/panhoramix
spring.datasource.username=panhoramix
spring.datasource.password=panhoramix
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# JWT
# ===============================
jwt.secret=this-is-a-test-secret-key-that-is-long-enough
jwt.expiration=3600000

# ===============================
# Cloudflare R2
# ===============================
cloudflare.r2.account-id=test-account-id
cloudflare.r2.access-key=test-access-key
cloudflare.r2.secret-key=test-secret-key
cloudflare.r2.public-url=http://localhost/test
cloudflare.r2.bucket=test-bucket
cloudflare.r2.region=auto

# ===============================
# Multipart
# ===============================
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ===============================
# Mail
# ===============================
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===============================
# Email verification
# ===============================
app.mail.from=test@panhoramix.com
app.email-verification.secret=test-secret-key-for-jwt-verification-123456789